# Firebase App Hosting configuration
runConfig:
  # Use Node.js 20 for better compatibility
  runtime: nodejs20
  # Start the custom Next.js server that handles PORT environment variable
  startCommand: cd pickleglass_web && npm start
  # Set the port that the container should listen on
  env:
    - variable: PORT
      value: "8080"
    - variable: NODE_ENV
      value: "production"

# Build configuration
buildConfig:
  # Only install and build the web application, skip root dependencies
  commands:
    - cd pickleglass_web && npm ci
    - cd pickleglass_web && npm run build
    - cd pickleglass_web && npm prune --production
