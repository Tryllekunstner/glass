# Firebase App Hosting configuration
runConfig:
  cpu: 1
  memory: 512Mi
  maxInstances: 10
  minInstances: 0
  concurrency: 80
  env:
    - variable: PORT
      value: "8080"
    - variable: NODE_ENV
      value: "production"

# Build configuration - build only the web app, not Electron
buildConfig:
  commands:
    - npm ci
    - npm run build
    - npm prune --production
  startCommand: npm start
